<title>CRASH LAB — 리얼 드라이빙 샌드박스</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta charset="utf-8">
<style>
:root{
  --bg:#0b0e13; --panel:rgba(18,22,30,.92); --panel2:rgba(28,34,46,.85);
  --line:rgba(255,255,255,.09); --tx:#eef2f8; --tx2:#9aa7b8;
  --acc:#ff7a1a; --acc2:#ffb25e; --ok:#3ddc84; --warn:#ffd23e; --bad:#ff4d4d;
  --r:14px; --sh:0 10px 40px rgba(0,0,0,.5);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;color:var(--tx);
  position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input[type=text]{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}

/* ---------- loading ---------- */
#loading{background:radial-gradient(120% 100% at 50% 0%,#1a2233 0%,#0b0e13 70%);z-index:99;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px}
#loading.off{display:none}
.logo{font-weight:900;font-size:min(13vw,64px);letter-spacing:.04em;line-height:1}
.logo b{color:var(--acc)}
.logo small{display:block;font-size:.28em;font-weight:600;color:var(--tx2);letter-spacing:.42em;margin-top:8px}
#loadBar{width:min(70vw,320px);height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#loadBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px;transition:width .2s}
#loadTip{color:var(--tx2);font-size:13px}

/* ---------- menu ---------- */
#menu{z-index:20;overflow:hidden;
  background:linear-gradient(97deg,rgba(9,12,18,.96) 0%,rgba(9,12,18,.9) 40%,rgba(9,12,18,.42) 68%,rgba(9,12,18,.08) 100%)}
@media (orientation:portrait){#menu{background:linear-gradient(180deg,rgba(9,12,18,.94) 0 52%,rgba(9,12,18,.25))}}
#menuBody{max-width:660px}
#menu .wrap{position:absolute;inset:0;padding:calc(var(--sat) + 14px) calc(var(--sar) + 18px) calc(var(--sab) + 14px) calc(var(--sal) + 18px);
  display:flex;flex-direction:column;overflow:hidden}
#menuHead{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding-bottom:10px}
#menuHead .mlogo{font-weight:900;font-size:22px;letter-spacing:.03em}
#menuHead .mlogo b{color:var(--acc)}
#menuHead .crumb{color:var(--tx2);font-size:13px;margin-left:2px}
#menuHead .spacer{flex:1}
#menuBody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 2px 12px}
.hero{position:relative;border-radius:20px;padding:26px 24px 22px;margin-bottom:18px;overflow:hidden;
  background:linear-gradient(120deg,rgba(255,122,26,.16),rgba(255,122,26,.02) 45%,rgba(60,120,255,.08)),
    radial-gradient(140% 180% at 85% -20%,#232f47 0%,#141a26 55%);
  border:1px solid rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(105deg,transparent 0 26px,rgba(255,255,255,.022) 26px 27px)}
.heroBadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.34em;color:var(--acc2);
  border:1px solid rgba(255,178,94,.4);border-radius:20px;padding:5px 12px 4px;margin-bottom:12px}
.heroTitle{font-size:min(9vw,42px);font-weight:900;line-height:1.12;letter-spacing:-.01em}
.heroTitle b{color:var(--acc)}
.heroSub{color:var(--tx2);font-size:13.5px;margin-top:10px;max-width:52ch;line-height:1.6}
.card.mode .ic{font-size:26px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;background:linear-gradient(140deg,rgba(255,122,26,.28),rgba(255,122,26,.05) 70%);
  border:1px solid rgba(255,178,94,.24)}
.card.mode:hover{border-color:rgba(255,122,26,.5)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .grid .card{animation:cardIn .4s cubic-bezier(.2,.7,.3,1) backwards}
  .grid .card:nth-child(1){animation-delay:.02s}.grid .card:nth-child(2){animation-delay:.06s}
  .grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.14s}
  .grid .card:nth-child(5){animation-delay:.18s}.grid .card:nth-child(6){animation-delay:.22s}
  .grid .card:nth-child(7){animation-delay:.26s}.grid .card:nth-child(8){animation-delay:.3s}
  .hero{animation:cardIn .5s cubic-bezier(.2,.7,.3,1) backwards}}
.btn{position:relative;overflow:hidden}
.btn:not(.ghost):not(.danger)::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);
  transform:translateX(-120%);animation:sheen 3.6s 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}28%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.h1{font-size:19px;font-weight:800;margin:6px 0 12px}
.h1 small{color:var(--tx2);font-weight:500;font-size:13px;margin-left:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-align:left;
  transition:transform .06s,border-color .12s;position:relative;overflow:hidden;display:block;width:100%}
.card:active{transform:scale(.97)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card .ic{font-size:26px;margin-bottom:8px;display:block}
.carImg{display:block;width:100%;height:112px;object-fit:contain;margin:-4px 0 4px;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.45))}
.card.carCard{background:linear-gradient(180deg,rgba(56,66,88,.5),rgba(24,29,40,.9) 62%),var(--panel2)}
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card .nm{font-weight:800;font-size:15px}
.card .ds{color:var(--tx2);font-size:12px;margin-top:4px;line-height:1.45}
.card .tag{position:absolute;top:11px;right:12px;font-size:11px;color:var(--acc2);font-weight:700}
.statRow{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--tx2)}
.statRow em{font-style:normal;width:34px;flex:0 0 auto}
.bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px}
.btn{background:linear-gradient(180deg,var(--acc),#e85f00);color:#fff;font-weight:800;font-size:16px;
  border-radius:12px;padding:14px 22px;box-shadow:0 6px 20px rgba(255,122,26,.35);transition:transform .06s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line)}
.btn.sm{font-size:13px;padding:9px 14px;border-radius:10px}
.btn.danger{background:linear-gradient(180deg,#ff5252,#d32f2f);box-shadow:0 6px 20px rgba(255,60,60,.3)}
.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--tx2);min-width:64px;white-space:nowrap}
.seg button.sel{background:var(--acc);color:#fff}
.optRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.optRow .lb{font-size:14px;font-weight:600}
.optRow .lb small{display:block;color:var(--tx2);font-weight:400;font-size:11.5px;margin-top:2px}
.optRow .ct{flex:0 0 auto;min-width:150px;max-width:60%}
.tgl{width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.12);position:relative;transition:background .15s;flex:0 0 auto}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on{background:var(--acc)}
.tgl.on i{left:25px}
.note{color:var(--tx2);font-size:12px;line-height:1.6;margin-top:10px}
.recBadge{font-size:11px;color:var(--ok);font-weight:700;margin-top:5px;display:block}

/* ---------- HUD ---------- */
#hud{z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
/* HUD 최소 모드: 속도계는 항상 유지하고, 계측 정보(손상·접지/G·서스·RPM·미니맵)만 감춘다 */
#hud.lean #dmgBox,#hud.lean #telem,
#hud.lean #minimap,#hud.lean #minimapHide,#hud.lean #modeWidget{display:none!important}
#btnHud.off{opacity:.55}
/* HUD 위치 편집 모드: 드래그로 배치 변경 */
#hud.layout .movable{outline:2px dashed var(--acc);outline-offset:3px;cursor:grab;
  pointer-events:auto!important;touch-action:none}
#hud.layout .movable::after{content:"⇕";position:absolute;right:-2px;top:-2px;font-size:11px;
  background:var(--acc);color:#111;border-radius:5px;padding:0 3px;font-weight:900}
#hud.layout #telem,#hud.layout #speedo,#hud.layout #dmgBox,
#hud.layout #minimap,#hud.layout #minimapHide{display:block!important}
#layoutBar{position:absolute;bottom:calc(var(--sab) + 14px);left:50%;transform:translateX(-50%);
  z-index:38;display:none;align-items:center;gap:10px;background:rgba(12,15,21,.9);
  padding:9px 14px;border-radius:22px;border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#layoutBar.on{display:flex}
#layoutBar span{font-size:11.5px;color:var(--tx2);font-weight:700}
#layoutBar button{background:var(--acc);color:#111;border-radius:9px;padding:6px 12px;font-weight:800;font-size:12px}
#layoutBar button.ghost{background:rgba(255,255,255,.12);color:var(--tx)}
.hudTop{position:absolute;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  display:flex;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;gap:8px;pointer-events:none}
.hudTop #modeWidget{margin-right:auto}
.hudTop>*{pointer-events:auto}
.iconBtn{width:46px;height:46px;border-radius:13px;background:var(--panel);border:1px solid var(--line);
  font-size:19px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex:0 0 auto}
.iconBtn:active{transform:scale(.93)}
.iconBtn.on{border-color:var(--acc);color:var(--acc)}
.iconBtn.blink{animation:blink .5s infinite alternate}
@keyframes blink{from{border-color:var(--line)}to{border-color:var(--bad);color:var(--bad);box-shadow:0 0 14px rgba(255,77,77,.6)}}
#modeWidget{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px 14px;font-size:13px;
  font-weight:700;min-width:90px;line-height:1.5;white-space:nowrap;position:relative;overflow:hidden}
/* 좌측 액센트 바 — 계기판 느낌 */
#modeWidget::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--acc),var(--acc2))}
#modeWidget .big{font-size:19px;font-weight:900;letter-spacing:-.01em}
#modeWidget .sub{color:var(--tx2);font-weight:600;font-size:11.5px}
#modeWidget:empty{display:none}
.hudSpacer{flex:1;pointer-events:none!important}

#speedo{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 6px);
  text-align:center;pointer-events:none;width:184px}
#gaugeSvg{display:block;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))}
#speedVal{position:absolute;left:0;right:0;top:42px;font-size:37px;font-weight:900;line-height:1;
  text-shadow:0 2px 12px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
#speedo .u{position:absolute;left:0;right:0;top:82px;font-size:10px;color:var(--tx2);font-weight:700;letter-spacing:.18em}
#gearVal{position:absolute;right:-30px;top:6px;font-size:18px;font-weight:900;color:var(--acc2)}
#minimap{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 158px);
  width:118px;height:118px;border-radius:50%;background:rgba(12,15,21,.72);
  border:2px solid rgba(255,255,255,.16);box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
#minimapHide{position:absolute;left:calc(var(--sal) + 108px);top:calc(var(--sat) + 156px);
  width:24px;height:24px;border-radius:50%;z-index:2;
  background:rgba(20,24,32,.92);border:1px solid rgba(255,255,255,.22);color:var(--tx2);
  font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
#minimapHide:active{color:var(--acc);transform:scale(.9)}

/* 손상 스키매틱: 차량 실루엣 카드 + 4구역 + 휠 4개 상태 */
#dmgBox{position:absolute;left:calc(var(--sal) + 12px);top:calc(var(--sat) + 64px);
  width:58px;height:88px;pointer-events:none;
  background:linear-gradient(165deg,rgba(30,37,52,.72),rgba(14,17,24,.78));
  border:1px solid var(--line);border-radius:12px;padding:7px 8px;
  box-shadow:0 6px 18px rgba(0,0,0,.4);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#dmgBox .z{position:absolute;background:var(--ok);transition:background .25s,box-shadow .25s}
#dmgF{left:16px;right:16px;top:7px;height:19px;border-radius:8px 8px 3px 3px}
#dmgB{left:16px;right:16px;bottom:7px;height:19px;border-radius:3px 3px 8px 8px}
#dmgL{left:8px;top:29px;bottom:29px;width:11px;border-radius:5px}
#dmgR{right:8px;top:29px;bottom:29px;width:11px;border-radius:5px}
#dmgBox .wh{position:absolute;width:7px;height:13px;border-radius:3px;background:#39424e;
  transition:background .25s}
#dmgBox .wh.w0{left:1px;top:16px}    #dmgBox .wh.w1{right:1px;top:16px}
#dmgBox .wh.w2{left:1px;bottom:16px} #dmgBox .wh.w3{right:1px;bottom:16px}

/* 텔레메트리 스트립 (하단 우측): G · 슬립 · 서스 · 기어 */
#telem{position:absolute;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 64px);
  display:none;flex-direction:column;gap:5px;pointer-events:none;width:132px}
#telem.on{display:flex}
#telem .row{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
  letter-spacing:.08em;color:var(--tx2);
  background:linear-gradient(165deg,rgba(30,37,52,.72),rgba(14,17,24,.78));
  border:1px solid var(--line);border-radius:9px;padding:4px 8px;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#telem .row .k{width:26px;flex:0 0 auto}
#telem .row .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#telem .row .bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--ok),var(--warn) 62%,var(--bad));transition:width .09s linear}
#telem .row .v{width:34px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}

#toast{position:absolute;top:calc(var(--sat) + 66px);left:50%;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:9px 18px;font-size:13.5px;font-weight:700;opacity:0;
  transition:opacity .25s;pointer-events:none!important;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#bigMsg{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:min(11vw,58px);font-weight:900;
  text-shadow:0 4px 24px rgba(0,0,0,.8);pointer-events:none!important;opacity:0;transition:opacity .2s}
#bigMsg.on{opacity:1}
#bigMsg small{display:block;font-size:16px;color:var(--acc2);font-weight:700;letter-spacing:.2em}

#debugHud{position:absolute;top:calc(var(--sat) + 66px);right:calc(var(--sar) + 12px);background:rgba(0,0,0,.65);
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:11px/1.7 ui-monospace,monospace;color:#9fe8ff;
  white-space:pre;display:none;pointer-events:none!important;text-align:left}
#debugHud.on{display:block}

/* controls */
#ctlL{position:absolute;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 14px);width:min(40vw,260px)}
#steerZone{height:74px;border-radius:37px;background:rgba(16,20,28,.6);border:1px solid var(--line);position:relative;touch-action:none}
#steerTrack{position:absolute;left:14px;right:14px;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;background:rgba(255,255,255,.13)}
#steerKnob{position:absolute;top:50%;left:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#3a4356,#232a38);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;
  justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#steerBtns{display:none;gap:10px}
#steerWheel{display:none;width:132px;height:132px;margin:0 auto;touch-action:none}
#steerWheelFace{width:100%;height:100%;border-radius:50%;position:relative;
  background:
    radial-gradient(circle at 50% 50%,#2a313e 0 24%,transparent 24.5%),
    conic-gradient(from 90deg,transparent 0 10deg,#39424f 10deg 170deg,transparent 170deg 190deg,#39424f 190deg 350deg,transparent 350deg),
    radial-gradient(circle at 50% 50%,transparent 0 60%,#39424f 61% 100%);
  border:3px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.5);
  will-change:transform}
#steerWheelFace::before{content:"";position:absolute;left:50%;top:6%;width:10px;height:22px;
  margin-left:-5px;border-radius:5px;background:var(--acc)}
#steerBtns .padBtn{flex:1;height:74px;border-radius:18px;font-size:26px}
.padBtn{background:rgba(16,20,28,.6);border:1px solid var(--line);color:var(--tx);border-radius:18px;
  display:flex;align-items:center;justify-content:center;font-weight:800;touch-action:none}
.padBtn.press{background:rgba(255,122,26,.32);border-color:var(--acc)}
#ctlR{position:absolute;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 14px);display:flex;align-items:flex-end;gap:10px}
#pedalBrake{width:76px;height:76px;border-radius:22px;font-size:24px}
#pedalGas{width:100px;height:110px;border-radius:26px;font-size:30px;background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.45)}
#btnHB{position:absolute;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 148px);width:76px;height:56px;
  border-radius:18px;font-size:20px}
#ctlHint{position:absolute;bottom:calc(var(--sab) + 100px);left:50%;transform:translateX(-50%);color:var(--tx2);
  font-size:12px;pointer-events:none!important;text-shadow:0 1px 4px #000}

/* crash test panel */
#crashPanel,#labPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(92vw,420px);
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:none;
  transition:transform .28s cubic-bezier(.4,0,.2,1)}
#crashPanel.on,#labPanel.on{display:block}
/* 하단 패널 접기: 화면 아래로 슬라이드(핸들 탭만 남음) */
#crashPanel.tuck,#labPanel.tuck{transform:translate(-50%,calc(100% + var(--sab) + 20px))}
.panelHide{position:absolute;top:-34px;right:8px;width:44px;height:30px;border-radius:10px 10px 0 0;
  background:var(--panel);border:1px solid var(--line);border-bottom:none;color:var(--tx2);
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
