<canvas id="gl"></canvas>

<div id="hud" class="screen">
  <div class="hudTop">
    <div id="modeWidget"></div>
    <div class="hudSpacer"></div>
    <button class="iconBtn" id="btnHome" title="홈으로">🏠</button>
    <button class="iconBtn" id="btnMap" title="미니맵 켜기/끄기">🗺️</button>
    <button class="iconBtn" id="btnPlaces" title="장소 이동" style="display:none">📍</button>
    <button class="iconBtn" id="btnRepair" title="수리">🔧</button>
    <button class="iconBtn" id="btnCarSwap" title="차량 교체">🚗</button>
    <button class="iconBtn" id="btnSlow" title="슬로모션">🐢</button>
    <button class="iconBtn" id="btnCam" title="카메라">🎥</button>
    <button class="iconBtn" id="btnReset" title="리셋">↺</button>
    <button class="iconBtn" id="btnPause" title="일시정지">⏸</button>
  </div>
  <div id="dmgBox">
    <div class="z" id="dmgF"></div><div class="z" id="dmgB"></div>
    <div class="z" id="dmgL"></div><div class="z" id="dmgR"></div>
  </div>
  <div id="debugHud"></div>
  <div id="toast"></div>
  <div id="bigMsg"></div>
  <div id="speedo">
    <svg id="gaugeSvg" viewBox="0 0 160 96" width="184" height="110">
      <defs>
        <linearGradient id="gGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffb25e"/><stop offset="100%" stop-color="#ff7a1a"/>
        </linearGradient>
        <linearGradient id="gRpm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3ddc84"/><stop offset="70%" stop-color="#ffd23e"/><stop offset="100%" stop-color="#ff4d4d"/>
        </linearGradient>
      </defs>
      <path id="gArcBg" fill="none" stroke="rgba(10,13,18,.55)" stroke-width="16" stroke-linecap="round"/>
      <path id="gArcBg2" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="9" stroke-linecap="round"/>
      <path id="gArc" fill="none" stroke="url(#gGrad)" stroke-width="9" stroke-linecap="round"/>
      <path id="gArcRpmBg" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3.5" stroke-linecap="round"/>
      <path id="gArcRpm" fill="none" stroke="url(#gRpm)" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div id="speedVal">0<span id="gearVal">N</span></div>
    <div class="u">KM/H</div>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="ctlL">
    <div id="steerZone"><div id="steerTrack"></div><div id="steerKnob">⇔</div></div>
    <div id="steerBtns"><button class="padBtn" id="btnStL">◀</button><button class="padBtn" id="btnStR">▶</button></div>
    <div id="steerWheel"><div id="steerWheelFace"></div></div>
  </div>
  <div id="ctlR">
    <button class="padBtn" id="pedalBrake">🛑</button>
    <button class="padBtn" id="pedalGas">▲</button>
  </div>
  <button class="padBtn" id="btnHB">🅿️</button>
  <div id="ctlHint"></div>
  <div id="crashPanel">
    <div class="seg" id="crashScenSeg"></div>
    <div class="row"><span style="font-size:13px;font-weight:700;color:var(--tx2)">발사 속도</span>
      <input type="range" id="crashSpeed" min="20" max="300" step="5" value="60">
      <span id="crashSpeedVal">60 km/h</span></div>
    <div id="crashFine" style="display:none">
      <div class="row"><span style="font-size:12px;color:var(--tx2)">충돌 각도</span>
        <input type="range" id="crashAng" min="-30" max="30" step="1" value="0">
        <span id="crashAngVal" style="font-size:13px;font-weight:800;color:var(--acc2);min-width:44px;text-align:right">0°</span></div>
      <div class="row"><span style="font-size:12px;color:var(--tx2)">충돌 위치</span>
        <input type="range" id="crashOff" min="-15" max="15" step="1" value="0">
        <span id="crashOffVal" style="font-size:13px;font-weight:800;color:var(--acc2);min-width:44px;text-align:right">0.0m</span></div>
      <div class="row"><span style="font-size:12px;color:var(--tx2)">상대 차량</span>
        <div class="seg" id="crashRamSeg" style="flex:1"></div></div>
    </div>
    <div class="row" style="margin-bottom:0">
      <div class="seg" id="crashTargetSeg" style="flex:1"></div>
      <button class="btn sm" id="btnFine">⚙ 세부</button>
      <button class="btn sm" id="btnLaunch">🚀 발사</button>
    </div>
  </div>
  <div id="labPanel">
    <div id="labStats"></div>
    <div class="row"><span style="font-size:13px;font-weight:700;color:var(--tx2)">가하는 힘</span>
      <input type="range" id="labForce" min="8" max="60" step="1" value="30">
      <span id="labForceVal">30</span></div>
    <div class="row" style="margin-bottom:0">
      <button class="btn sm" id="labPrev">◀ 이전 차</button>
      <button class="btn sm" id="labNext">다음 차 ▶</button>
    </div>
    <div id="labHint">차체를 탭 = 그 지점에 힘 · 드래그 = 회전 · 🔧 = 복원</div>
  </div>
</div>

<div id="menu" class="screen on">
  <div class="wrap">
    <div id="menuHead">
      <button class="iconBtn" id="btnMenuBack" style="display:none">←</button>
      <div class="mlogo">CRASH<b>LAB</b></div>
      <div class="crumb" id="menuCrumb"></div>
      <div class="spacer"></div>
      <button class="iconBtn" id="btnSettings">⚙️</button>
    </div>
    <div id="menuBody"></div>
  </div>
</div>

<div id="pausePanel" class="overlayPanel"><div class="panelBox">
  <h2>일시정지</h2>
  <div class="stack" id="pauseBtns"></div>
</div></div>

<div id="reportPanel" class="overlayPanel"><div class="panelBox" id="reportBox"></div></div>
<div id="resultPanel" class="overlayPanel"><div class="panelBox" id="resultBox"></div></div>
<div id="placesPanel" class="overlayPanel"><div class="panelBox">
  <h3 style="margin:0 0 10px">📍 장소 이동</h3>
  <div id="placesList"></div>
  <button class="btn sm" id="placesClose" style="margin-top:12px">닫기</button>
</div></div>

<div id="editorScr" class="screen"><div class="wrap">
  <div id="edLeft">
    <div id="edTopBar">
      <button class="btn sm ghost" id="edExit">← 나가기</button>
      <input type="text" id="edName" placeholder="맵 이름" maxlength="18">
      <button class="btn sm ghost" id="edRotate">↻ 회전</button>
      <button class="btn sm" id="edSave">💾 저장</button>
      <button class="btn sm" id="edTest">▶ 테스트</button>
    </div>
    <div id="edCanvasWrap"><canvas id="edCanvas"></canvas></div>
  </div>
  <div id="edSide"></div>
</div></div>

<div id="loading" class="screen on">
  <div class="logo">CRASH<b>LAB</b><small>REAL DRIVING SANDBOX</small></div>
  <div id="loadBar"><i></i></div>
  <div id="loadTip">물리 엔진 예열 중…</div>
</div>
